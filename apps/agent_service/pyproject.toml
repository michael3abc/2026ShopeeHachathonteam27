[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "return-agent-service"
version = "0.1.0"
requires-python = "==3.12.0"
dependencies = [
  "return-agent-contracts", "return-agent-runtime", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "httpx>=0.27,<1", "redis>=5,<7",
  "psycopg[binary,pool]>=3.2,<4", "langgraph-checkpoint-postgres>=3,<4",
  "sqlalchemy>=2,<3", "alembic>=1.14,<2", "langchain-openai>=1.2,<2",
]

[project.scripts]
return-agent-service = "return_agent_service.main:main"

[tool.uv.sources]
return-agent-contracts = { workspace = true }
return-agent-runtime = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
return_agent_service = ["prompts/*.txt"]
