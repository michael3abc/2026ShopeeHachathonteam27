[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "return-agent-api"
version = "0.1.0"
requires-python = "==3.12.0"
dependencies = [
  "return-agent-contracts", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "sqlalchemy>=2,<3", "alembic>=1.14,<2", "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1", "redis>=5,<7", "httpx>=0.27,<1", "openai>=2.26,<3",
]

[project.scripts]
return-agent-api = "return_agent.main:main"

[tool.uv.sources]
return-agent-contracts = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
