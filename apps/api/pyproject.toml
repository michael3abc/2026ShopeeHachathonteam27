[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "return-agent-api"
version = "0.1.0"
description = "FastAPI backend for adaptive return resolution"
readme = "README.md"
requires-python = "==3.12.0"
dependencies = [
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "openai>=2.26,<3",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "return-agent-contracts",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "fakeredis>=2.26,<3",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
return-agent-api = "return_agent.main:main"
return-agent-seed-evidence = "return_agent.cli:main"
return-agent-ingest-policy = "return_agent.policy_cli:main"
return-agent-backfill-memory = "return_agent.memory_cli:main"

[tool.uv.sources]
return-agent-contracts = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
