[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "return-agent-contracts"
version = "0.1.0"
requires-python = "==3.12.0"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
return-agent-export-schemas = "return_agent_contracts.export:main"

[tool.setuptools.packages.find]
where = ["src"]
