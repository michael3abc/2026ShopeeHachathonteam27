name: return-agent-team27
services:
  api-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: return_agent
      POSTGRES_PASSWORD: local-demo
      POSTGRES_DB: return_agent
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["api-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U return_agent -d return_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
  agent-db:
    image: postgres:16
    environment:
      POSTGRES_USER: return_agent
      POSTGRES_PASSWORD: local-demo
      POSTGRES_DB: return_agent
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["agent-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U return_agent -d return_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/python.Dockerfile
    command: ["return-agent-api"]
    environment:
      API_HOST: 0.0.0.0
      API_PROFILE: unconfigured
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      api-db: { condition: service_healthy }
      redis: { condition: service_healthy }
  agent:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/python.Dockerfile
    command: ["return-agent-service"]
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_PROFILE: demo
      NARRATION_ENABLED: "false"
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      agent-db: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      API_BASE_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
volumes:
  api-db:
  agent-db:
  redis:
