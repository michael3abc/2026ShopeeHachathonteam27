[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "return-agent-service"
version = "0.1.0"
description = "Redis worker and composition boundary for the return Agent"
readme = "README.md"
requires-python = "==3.12.0"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5,<7",
  "return-agent-contracts",
  "return-agent-runtime",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "fakeredis>=2.26,<3",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
return-agent-service = "return_agent_service.main:main"

[tool.uv.sources]
return-agent-contracts = { workspace = true }
return-agent-runtime = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
return_agent_service = ["migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
