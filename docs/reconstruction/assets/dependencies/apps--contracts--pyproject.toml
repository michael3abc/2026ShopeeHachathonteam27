[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "return-agent-contracts"
version = "0.1.0"
description = "Shared executable contracts for adaptive return resolution"
readme = "README.md"
requires-python = "==3.12.0"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = [
  "jsonschema>=4,<5",
  "pytest>=8,<9",
  "respx>=0.22,<1",
]

[project.scripts]
return-agent-export-schemas = "return_agent_contracts.export_schemas:main"
return-agent-export-ui-schemas = "return_agent_contracts.export_ui_schemas:main"
return-agent-export-operations-schemas = "return_agent_contracts.export_operations_schemas:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
