[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "return-agent-runtime"
version = "0.1.0"
description = "LangGraph runtime for adaptive return resolution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.2,<2",
  "langgraph>=1.2,<2",
  "pydantic>=2,<3",
  "return-agent-contracts",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.uv.sources]
return-agent-contracts = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
return_agent_runtime = ["prompt_text/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
