[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "return-agent-runtime"
version = "0.1.0"
requires-python = "==3.12.0"
dependencies = ["return-agent-contracts", "langgraph>=1.2,<2", "langchain-core>=1.2,<2"]

[tool.uv.sources]
return-agent-contracts = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
